name: Build Grexcode

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o grexcode .
          chmod +x grexcode

      - name: Create tarball
        run: |
          tar -czf grexcode-linux-x86_64.tar.gz grexcode
          sha256sum grexcode-linux-x86_64.tar.gz > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Grexcode ${{ github.event.inputs.tag || github.ref_name }}
          body: "Grexcode - AI coding assistant"
          files: |
            grexcode-linux-x86_64.tar.gz
            checksums.txt
