name: Build and Release Grexcode

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o grexcode .

      - name: Create tarball
        run: |
          tar -czf grexcode-linux-x86_64.tar.gz grexcode

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: grexcode-linux-x86_64.tar.gz
